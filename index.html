<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asthik</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2300c853'/%3E%3Cpath d='M16 6l2.6 8.4L27 17l-8.4 2.6L16 28l-2.6-8.4L5 17l8.4-2.6z' fill='%2306170d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <div class="gate-mark">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
    </div>
    <h1>Enter access code</h1>
    <p class="gate-sub">This chat is private. Enter your access code to continue.</p>
    <input id="gate-input" type="password" autocomplete="off" placeholder="Access code" />
    <button id="gate-submit" type="submit">Continue</button>
    <p id="gate-error" class="gate-error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
      </span>
      <span class="brand-name">Asthik</span>
    </div>
    <button id="new-chat" class="new-chat-btn" title="Start a new chat (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="history-search" type="text" placeholder="Search chats" autocomplete="off" />
    </div>
    <div id="history-list" class="history-list"></div>
    <button id="clear-chats" class="logout-btn danger" title="Delete all chats">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      Clear all
    </button>
    <button id="logout" class="logout-btn">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="menu-toggle" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-right">
        <div class="effort-select" id="effort-select" role="group" aria-label="Thinking effort">
          <button type="button" class="effort-btn" data-effort="low">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="6.5" y="6" width="3" height="9" rx="1" fill="currentColor" opacity="0.35"/><rect x="12" y="2" width="3" height="13" rx="1" fill="currentColor" opacity="0.35"/></svg>
            Low
          </button>
          <button type="button" class="effort-btn" data-effort="medium">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="6.5" y="6" width="3" height="9" rx="1" fill="currentColor"/><rect x="12" y="2" width="3" height="13" rx="1" fill="currentColor" opacity="0.35"/></svg>
            Medium
          </button>
          <button type="button" class="effort-btn" data-effort="high">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="6.5" y="6" width="3" height="9" rx="1" fill="currentColor"/><rect x="12" y="2" width="3" height="13" rx="1" fill="currentColor"/></svg>
            High
          </button>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div class="messages-wrap">
      <div id="messages" class="messages"></div>
      <button id="scroll-bottom" class="scroll-bottom hidden" title="Scroll to latest">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <form id="composer" class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message Asthik..." autofocus></textarea>
        <div class="composer-footer">
          <span id="token-estimate" class="token-estimate"></span>
          <button id="export-chat" type="button" class="composer-tool" title="Export this chat">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button id="send" type="submit" aria-label="Send">
            <svg id="send-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            <svg id="stop-icon" viewBox="0 0 24 24" width="14" height="14" class="hidden" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </form>
  </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
