<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <h1>Enter access code</h1>
    <input id="gate-input" type="password" autocomplete="off" placeholder="Access code" />
    <button type="submit">Continue</button>
    <p id="gate-error" class="gate-error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <button id="new-chat" class="new-chat-btn">+ New chat</button>
    <div id="history-list" class="history-list"></div>
    <button id="logout" class="logout-btn">Sign out</button>
  </aside>

  <main class="main">
    <div id="messages" class="messages">
      <div class="empty-state">
        <h2>What can I help with?</h2>
      </div>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Message Claude..." autofocus></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
      </button>
    </form>
  </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
