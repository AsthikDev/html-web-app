<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prism</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c96442'/%3E%3Cpath d='M16 6l2.6 8.4L27 17l-8.4 2.6L16 28l-2.6-8.4L5 17l8.4-2.6z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form" class="gate-card">
    <div class="gate-mark">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
    </div>
    <h1>Enter access code</h1>
    <p class="gate-sub">This chat is private. Enter your access code to continue.</p>
    <input id="gate-input" type="password" autocomplete="off" placeholder="Access code" />
    <button id="gate-submit" type="submit">Continue</button>
    <p id="gate-error" class="gate-error"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
      </span>
      <span class="brand-name">Prism</span>
    </div>
    <button id="new-chat" class="new-chat-btn" title="Start a new chat (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      New chat
    </button>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M10 4a6 6 0 1 0 3.76 10.68l4.78 4.78 1.42-1.42-4.78-4.78A6 6 0 0 0 10 4zm-4 6a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg>
      <input id="history-search" type="text" placeholder="Search chats" autocomplete="off" />
    </div>
    <div id="history-list" class="history-list"></div>
    <button id="clear-chats" class="logout-btn danger" title="Delete all chats">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4 7h16v2H4V7zm3-4h6l1 2H6l1-2zM6 9h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9z"/></svg>
      Clear all
    </button>
    <button id="logout" class="logout-btn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 17v-2H5V9h5V7l5 5-5 5zM5 3h9a2 2 0 0 1 2 2v3h-2V5H5v14h9v-3h2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
      Sign out
    </button>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="menu-toggle" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="topbar-right">
        <div class="effort-select" id="effort-select" role="group" aria-label="Thinking effort">
          <button type="button" class="effort-btn" data-effort="low">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="6.5" y="6" width="3" height="9" rx="1" fill="currentColor" opacity="0.35"/><rect x="12" y="2" width="3" height="13" rx="1" fill="currentColor" opacity="0.35"/></svg>
            Low
          </button>
          <button type="button" class="effort-btn" data-effort="medium">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="6.5" y="6" width="3" height="9" rx="1" fill="currentColor"/><rect x="12" y="2" width="3" height="13" rx="1" fill="currentColor" opacity="0.35"/></svg>
            Medium
          </button>
          <button type="button" class="effort-btn" data-effort="high">
            <svg viewBox="0 0 16 16" width="13" height="13"><rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="6.5" y="6" width="3" height="9" rx="1" fill="currentColor"/><rect x="12" y="2" width="3" height="13" rx="1" fill="currentColor"/></svg>
            High
          </button>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-15a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l1.41 1.41a1 1 0 1 1-1.41 1.42L4.22 5.64a1 1 0 0 1 0-1.42zm14.14 14.14a1 1 0 0 1 1.41 0l1.41 1.41a1 1 0 1 1-1.41 1.41l-1.41-1.41a1 1 0 0 1 0-1.41zM1 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H2a1 1 0 0 1-1-1zm18 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.41l1.41-1.41a1 1 0 1 1 1.42 1.41l-1.41 1.41a1 1 0 0 1-1.42 0zM18.36 5.64a1 1 0 0 1 0-1.42l1.41-1.41a1 1 0 1 1 1.41 1.41l-1.41 1.42a1 1 0 0 1-1.41 0z"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div class="messages-wrap">
      <div id="messages" class="messages"></div>
      <button id="scroll-bottom" class="scroll-bottom hidden" title="Scroll to latest">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 16l-6-6h12z"/></svg>
      </button>
    </div>

    <form id="composer" class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message Prism..." autofocus></textarea>
        <div class="composer-footer">
          <span id="token-estimate" class="token-estimate"></span>
          <button id="export-chat" type="button" class="composer-tool" title="Export this chat">
            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17 6.3 11.7l1.4-1.4 3.3 3.3V3h1zM5 19h14v2H5z"/></svg>
          </button>
          <button id="send" type="submit" aria-label="Send">
            <svg id="send-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3.5l7 7-1.4 1.4-4.6-4.6V20h-2V7.3L6.4 11.9 5 10.5z"/></svg>
            <svg id="stop-icon" viewBox="0 0 24 24" width="14" height="14" class="hidden"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </form>
  </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
